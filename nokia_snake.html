<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>NOKIA SNAKE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
  --screen-bg: #8bac0f;
  --screen-dark: #0f380f;
  --screen-mid: #306230;
  --screen-light: #9bbc0f;
  --phone-body: #c8c8c8;
  --phone-mid: #a0a0a0;
  --phone-dark: #606060;
  --phone-btn: #303030;
  --phone-btn-hi: #505050;
  --phone-accent: #b0b8c8;
  --nokia-blue: #1a3a6e;
}

* {
  box-sizing: border-box;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  margin: 0; padding: 0;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: center;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, #16213e 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, #0f3460 0%, transparent 50%);
  z-index: 0;
}

/* scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.07) 2px,
    rgba(0,0,0,0.07) 4px
  );
  pointer-events: none;
  z-index: 999;
}

.scene {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

/* ── PHONE BODY ── */
.phone {
  width: min(340px, 92vw);
  background: linear-gradient(160deg, #d8d8d8 0%, #b0b0b0 40%, #989898 100%);
  border-radius: 28px 28px 36px 36px;
  padding: 14px 14px 20px;
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.7),
    inset 0 -3px 6px rgba(0,0,0,0.25),
    0 20px 60px rgba(0,0,0,0.7),
    0 6px 20px rgba(0,0,0,0.5);
  position: relative;
}

/* brand stripe */
.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 10px;
  background: var(--nokia-blue);
  border-radius: 28px 28px 0 0;
}

/* brand label */
.brand {
  font-family: 'Arial Narrow', Arial, sans-serif;
  font-weight: 900;
  font-style: italic;
  font-size: 18px;
  color: var(--nokia-blue);
  letter-spacing: 4px;
  text-align: center;
  margin: 8px 0 10px;
  text-shadow: 0 1px 0 rgba(255,255,255,0.5);
}

/* ── SCREEN BEZEL ── */
.screen-bezel {
  background: #222;
  border-radius: 10px;
  padding: 8px;
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,0.8),
    0 2px 4px rgba(255,255,255,0.15);
  margin-bottom: 12px;
}

.screen-inner {
  background: var(--screen-bg);
  border-radius: 4px;
  padding: 6px;
  position: relative;
  overflow: hidden;
}

/* LCD flicker */
.screen-inner::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.08) 0%,
    transparent 40%,
    rgba(0,0,0,0.05) 100%
  );
  pointer-events: none;
  border-radius: 4px;
}

/* HUD row */
.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2px 4px;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: var(--screen-dark);
  line-height: 1;
}

.hud-score { flex: 1; text-align: left; }
.hud-pct   { flex: 1; text-align: center; }
.hud-hi    { flex: 1; text-align: right; }

/* progress bar */
.prog-wrap {
  height: 5px;
  background: var(--screen-mid);
  border-radius: 2px;
  margin-bottom: 4px;
  overflow: hidden;
}
.prog-bar {
  height: 100%;
  background: var(--screen-dark);
  width: 0%;
  transition: width 0.25s;
  border-radius: 2px;
}

/* ── CANVAS ── */
canvas {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  image-rendering: pixelated;
  border-radius: 2px;
}

/* ── SPEAKER GRILLE ── */
.speaker {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin: 8px 0 4px;
}
.speaker span {
  width: 3px;
  height: 16px;
  background: var(--phone-dark);
  border-radius: 2px;
  opacity: 0.6;
}

/* ── MIDDLE ROW (call buttons) ── */
.mid-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 10px;
  margin-bottom: 8px;
}

.soft-btn {
  width: 50px;
  height: 26px;
  background: linear-gradient(180deg, #555 0%, #333 100%);
  border-radius: 4px;
  box-shadow: 0 3px 5px rgba(0,0,0,0.4), inset 0 1px rgba(255,255,255,0.1);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 5px;
  color: #9bbc0f;
  letter-spacing: 0.5px;
}
.soft-btn:active { transform: translateY(1px); }

.call-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%);
  box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 1px rgba(255,255,255,0.2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.call-btn.end {
  background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
}
.call-btn:active { transform: translateY(2px); }

/* ── D-PAD ── */
.dpad-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin: 4px 0 8px;
}

.dpad-row {
  display: flex;
  gap: 0;
  align-items: center;
}

.dpad-btn {
  width: 72px;
  height: 72px;
  background: linear-gradient(145deg, #3a3a3a 0%, #202020 100%);
  border: 2px solid #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: #ccc;
  cursor: pointer;
  position: relative;
  box-shadow: inset 0 1px rgba(255,255,255,0.08);
  transition: background 0.05s;
}

.dpad-btn:active,
.dpad-btn.pressed {
  background: linear-gradient(145deg, #222 0%, #111 100%);
  color: #9bbc0f;
}

/* D-pad shape */
.dpad-btn.up    { border-radius: 12px 12px 0 0; width: 72px; height: 64px; }
.dpad-btn.down  { border-radius: 0 0 12px 12px; width: 72px; height: 64px; }
.dpad-btn.left  { border-radius: 12px 0 0 12px; width: 64px; height: 72px; }
.dpad-btn.right { border-radius: 0 12px 12px 0; width: 64px; height: 72px; }

.dpad-center {
  width: 72px;
  height: 72px;
  background: radial-gradient(circle, #3a3a3a, #1a1a1a);
  border: 2px solid #111;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  color: #9bbc0f;
  font-family: 'Press Start 2P', monospace;
  cursor: pointer;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  z-index: 2;
  letter-spacing: -0.5px;
}
.dpad-center:active { background: radial-gradient(circle, #2a2a2a, #0a0a0a); }

/* ── NUM KEYS ── */
.numkeys {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 0 8px;
}

.nkey {
  height: 36px;
  background: linear-gradient(180deg, #484848 0%, #282828 100%);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: #bbb;
  box-shadow: 0 3px 5px rgba(0,0,0,0.4), inset 0 1px rgba(255,255,255,0.08);
  cursor: pointer;
}
.nkey:active { transform: translateY(1px); background: linear-gradient(180deg, #282828 0%, #181818 100%); }

/* ── OVERLAY ── */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(11,56,11,0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 4px;
  z-index: 10;
  font-family: 'Press Start 2P', monospace;
  color: var(--screen-light);
}

.overlay.hidden { display: none; }

.ov-title {
  font-size: 10px;
  animation: blink 1s step-end infinite;
}
.ov-sub { font-size: 7px; color: #9bbc0f; }
.ov-score { font-size: 8px; }

@keyframes blink {
  50% { opacity: 0; }
}

/* ── PIXEL FONT fallback ── */
.px { font-family: 'Press Start 2P', monospace; }
</style>
</head>
<body>
<div class="scene">
<div class="phone">

  <!-- brand stripe is ::before -->
  <div class="brand">NOKIA</div>

  <!-- SCREEN -->
  <div class="screen-bezel">
    <div class="screen-inner">

      <!-- HUD -->
      <div class="hud">
        <div class="hud-score px">PT:<span id="scoreDisplay">0</span></div>
        <div class="hud-pct px"><span id="pctDisplay">0</span>%</div>
        <div class="hud-hi px">MAX:<span id="hiDisplay">0</span></div>
      </div>

      <!-- progress -->
      <div class="prog-wrap">
        <div class="prog-bar" id="progBar"></div>
      </div>

      <!-- game canvas -->
      <div style="position:relative;">
        <canvas id="game" width="280" height="280"></canvas>

        <!-- overlay start/gameover -->
        <div class="overlay" id="overlay">
          <div class="ov-title" id="ovTitle">NOKIA SNAKE</div>
          <div class="ov-sub" id="ovSub">PRESIONA OK</div>
          <div class="ov-score" id="ovScore"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- speaker -->
  <div class="speaker">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- soft keys + call buttons -->
  <div class="mid-row">
    <div class="soft-btn" id="btnMenu">MENU</div>
    <div class="call-btn" id="btnCall">📞</div>
    <div class="call-btn end" id="btnEnd">📵</div>
    <div class="soft-btn" id="btnNames">NAMES</div>
  </div>

  <!-- D-PAD -->
  <div class="dpad-wrap">
    <div class="dpad-row">
      <div class="dpad-btn up px" id="btnUp">▲</div>
    </div>
    <div class="dpad-row">
      <div class="dpad-btn left px" id="btnLeft">◀</div>
      <div class="dpad-center px" id="btnOk">OK</div>
      <div class="dpad-btn right px" id="btnRight">▶</div>
    </div>
    <div class="dpad-row">
      <div class="dpad-btn down px" id="btnDown">▼</div>
    </div>
  </div>

  <!-- num keys -->
  <div class="numkeys">
    <div class="nkey px">1</div><div class="nkey px">2</div><div class="nkey px">3</div>
    <div class="nkey px">4</div><div class="nkey px">5</div><div class="nkey px">6</div>
    <div class="nkey px">7</div><div class="nkey px">8</div><div class="nkey px">9</div>
    <div class="nkey px">*</div><div class="nkey px">0</div><div class="nkey px">#</div>
  </div>

</div>
</div>

<script>
/* ═══════════════════════════════════════
   AUDIO ENGINE
═══════════════════════════════════════ */
let audioCtx = null;

function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq, dur, type='square', vol=0.15) {
  const a = getAudio(); if (!a) return;
  const o = a.createOscillator();
  const g = a.createGain();
  o.connect(g); g.connect(a.destination);
  o.type = type;
  o.frequency.setValueAtTime(freq, a.currentTime);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur/1000);
  o.start(a.currentTime);
  o.stop(a.currentTime + dur/1000);
}

function eatSound() {
  // Classic Nokia-ish eat melody
  beep(880, 60, 'square', 0.12);
  setTimeout(() => beep(1046, 60, 'square', 0.10), 60);
}

function deathSound() {
  beep(220, 150, 'sawtooth', 0.2);
  setTimeout(() => beep(180, 150, 'sawtooth', 0.2), 150);
  setTimeout(() => beep(140, 300, 'sawtooth', 0.25), 300);
}

function startSound() {
  const notes = [659, 784, 880, 1046];
  notes.forEach((f,i) => setTimeout(() => beep(f, 100, 'square', 0.12), i*110));
}

function turnSound() {
  beep(440, 30, 'square', 0.05);
}

/* ═══════════════════════════════════════
   GAME ENGINE
═══════════════════════════════════════ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 20;
const ROWS = 20;
const TILE = canvas.width / COLS; // 14

const MAX_SCORE = COLS * ROWS - 5; // theoretical max
let snake, food, dx, dy, ndx, ndy, score, hiScore, running, paused, animId;

hiScore = parseInt(localStorage.getItem('snakeHi') || '0');
document.getElementById('hiDisplay').textContent = hiScore;

function rnd(n) { return Math.floor(Math.random() * n); }

function randomFood() {
  let f;
  const occupied = new Set(snake.map(p => p.x + ',' + p.y));
  do { f = { x: rnd(COLS), y: rnd(ROWS) }; }
  while (occupied.has(f.x + ',' + f.y));
  return f;
}

/* ── Drawing ── */
function drawCheckerBg() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#9bbc0f' : '#8bac0f';
      ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
    }
  }
}

function drawFood() {
  const cx = food.x * TILE + TILE / 2;
  const cy = food.y * TILE + TILE / 2;
  const r = TILE / 2 - 1;

  // Apple body
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.arc(cx, cy + 1, r, 0, Math.PI * 2);
  ctx.fill();

  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(cx - 2, cy - 2, r * 0.4, r * 0.25, -0.5, 0, Math.PI * 2);
  ctx.fill();

  // Stem
  ctx.strokeStyle = '#306230';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, food.y * TILE + 1);
  ctx.quadraticCurveTo(cx + 3, food.y * TILE - 2, cx + 5, food.y * TILE + 1);
  ctx.stroke();
}

function drawSnake() {
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const x = seg.x * TILE;
    const y = seg.y * TILE;
    const pad = 1;

    // Body shade gradient per segment
    const t = i / snake.length;
    const lightness = Math.round(20 + t * 20);
    ctx.fillStyle = isHead ? '#0f380f' : `hsl(100,50%,${lightness}%)`;

    ctx.fillRect(x + pad, y + pad, TILE - pad * 2, TILE - pad * 2);

    // Eye on head
    if (isHead) {
      ctx.fillStyle = '#8bac0f';
      const ex = dx === 1 ? x + TILE - 4 : dx === -1 ? x + 3 : x + TILE/2 - 1;
      const ey = dy === 1 ? y + TILE - 4 : dy === -1 ? y + 3 : y + TILE/2 - 2;
      ctx.fillRect(ex, ey, 2, 2);
    }

    // Scale pattern on body
    if (!isHead && i % 2 === 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(x + pad + 2, y + pad + 2, TILE - pad*2 - 4, TILE - pad*2 - 4);
    }
  });
}

function render() {
  drawCheckerBg();
  drawFood();
  drawSnake();
}

/* ── HUD ── */
function updateHud() {
  document.getElementById('scoreDisplay').textContent = score;
  const pct = Math.min(100, Math.round(score / MAX_SCORE * 100));
  document.getElementById('pctDisplay').textContent = pct;
  document.getElementById('progBar').style.width = pct + '%';
  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('snakeHi', hiScore);
    document.getElementById('hiDisplay').textContent = hiScore;
  }
}

/* ── Overlay ── */
function showOverlay(title, sub, scoreStr) {
  const ov = document.getElementById('overlay');
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovSub').textContent = sub;
  document.getElementById('ovScore').textContent = scoreStr;
  ov.classList.remove('hidden');
}
function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

/* ── Game loop ── */
let lastTime = 0;
let speed = 150; // ms per tick

function loop(ts) {
  if (!running) return;
  animId = requestAnimationFrame(loop);
  if (ts - lastTime < speed) return;
  lastTime = ts;
  tick();
}

function tick() {
  // Apply queued direction
  dx = ndx; dy = ndy;

  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(p => p.x === head.x && p.y === head.y)) {
    running = false;
    deathSound();
    setTimeout(() => {
      showOverlay('GAME OVER', 'PRESIONA OK', 'PT: ' + score);
    }, 400);
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    eatSound();
    food = randomFood();
    // Increase speed slightly
    speed = Math.max(70, 150 - score * 3);
    updateHud();
  } else {
    snake.pop();
  }

  render();
}

/* ── Start / Reset ── */
function initGame() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];
  dx = 1; dy = 0;
  ndx = 1; ndy = 0;
  score = 0;
  speed = 150;
  food = randomFood();
  updateHud();
  render();
}

function startGame() {
  getAudio(); // unlock on user gesture
  hideOverlay();
  initGame();
  running = true;
  lastTime = 0;
  startSound();
  requestAnimationFrame(loop);
}

/* ── Controls ── */
function setDir(dir) {
  if (dir === 'up'    && dy === 0)  { ndx = 0;  ndy = -1; turnSound(); }
  if (dir === 'down'  && dy === 0)  { ndx = 0;  ndy = 1;  turnSound(); }
  if (dir === 'left'  && dx === 0)  { ndx = -1; ndy = 0;  turnSound(); }
  if (dir === 'right' && dx === 0)  { ndx = 1;  ndy = 0;  turnSound(); }
}

function pressBtn(id, duration) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('pressed');
  setTimeout(() => el.classList.remove('pressed'), duration || 120);
}

function addDirBtn(id, dir) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); setDir(dir); pressBtn(id); }, { passive: false });
  el.addEventListener('mousedown', () => setDir(dir));
}

addDirBtn('btnUp', 'up');
addDirBtn('btnDown', 'down');
addDirBtn('btnLeft', 'left');
addDirBtn('btnRight', 'right');

document.getElementById('btnOk').addEventListener('touchstart', e => { e.preventDefault(); handleOk(); }, { passive: false });
document.getElementById('btnOk').addEventListener('click', handleOk);

function handleOk() {
  getAudio();
  if (!running) startGame();
}

// Keyboard
window.addEventListener('keydown', e => {
  if ([37,38,39,40,13,32].includes(e.keyCode)) e.preventDefault();
  if (!running && (e.key === 'Enter' || e.key === ' ')) { startGame(); return; }
  if (e.key === 'ArrowUp')    setDir('up');
  if (e.key === 'ArrowDown')  setDir('down');
  if (e.key === 'ArrowLeft')  setDir('left');
  if (e.key === 'ArrowRight') setDir('right');
});

/* ── Init ── */
initGame();
showOverlay('NOKIA SNAKE', 'PRESIONA OK', '');
</script>
</body>
</html>
