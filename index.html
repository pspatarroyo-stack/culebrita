<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nokia Culebrita Retro</title>
<style>
  body{
    background:#9bbb58;
    font-family: monospace;
    text-align:center;
    margin:0;
    padding:20px;
    color:#243800;
  }

  .phone{
    max-width:380px;
    margin:auto;
    background:#6e7f4f;
    border-radius:28px;
    padding:20px;
    box-shadow: inset 0 0 10px rgba(0,0,0,.25);
  }

  h1{
    font-size:24px;
    margin:5px 0;
  }

  canvas{
    background:#b7d37b;
    border:5px solid #3f4f22;
    border-radius:8px;
    max-width:100%;
    touch-action:none;
  }

  .score{
    font-size:18px;
    margin:10px 0;
  }

  .controls{
    margin-top:18px;
    display:grid;
    grid-template-columns:70px 70px 70px;
    gap:8px;
    justify-content:center;
  }

  button{
    font-size:22px;
    border:none;
    border-radius:50%;
    width:70px;
    height:70px;
    background:#4b5f2d;
    color:#d7ef9a;
  }

  button:active{
    transform:scale(.95);
  }
</style>
</head>
<body>

<div class="phone">
  <h1>📱 NOKIA SNAKE</h1>
  <div class="score">Puntos: <span id="score">0</span></div>

  <canvas id="game" width="300" height="300"></canvas>

  <div class="controls">
    <div></div>
    <button onclick="setDir('up')">▲</button>
    <div></div>

    <button onclick="setDir('left')">◀</button>
    <button onclick="setDir('down')">▼</button>
    <button onclick="setDir('right')">▶</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const size=15;
const tiles=canvas.width/size;

let snake=[{x:10,y:10}];
let food=randomFood();
let dx=1;
let dy=0;
let score=0;

function beep(freq,duration){
  const a=new (window.AudioContext||window.webkitAudioContext)();
  const o=a.createOscillator();
  const g=a.createGain();

  o.connect(g);
  g.connect(a.destination);

  o.frequency.value=freq;
  o.type="square";

  o.start();

  g.gain.exponentialRampToValueAtTime(
    0.0001,
    a.currentTime + duration/1000
  );

  o.stop(a.currentTime + duration/1000);
}

function randomFood(){
  return {
    x:Math.floor(Math.random()*tiles),
    y:Math.floor(Math.random()*tiles)
  };
}

function draw(){
  ctx.fillStyle="#b7d37b";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#2f3b16";
  ctx.fillRect(food.x*size,food.y*size,size,size);

  snake.forEach((p)=>{
    ctx.fillStyle="#243800";
    ctx.fillRect(p.x*size,p.y*size,size-1,size-1);
  });
}

function reset(){
  snake=[{x:10,y:10}];
  dx=1;dy=0;
  score=0;
  document.getElementById("score").textContent=0;
  food=randomFood();
}

function update(){
  const head={x:snake[0].x+dx,y:snake[0].y+dy};

  if(
    head.x<0||head.y<0||
    head.x>=tiles||head.y>=tiles||
    snake.some(p=>p.x===head.x&&p.y===head.y)
  ){
    beep(180,300);
    alert("GAME OVER\nPuntaje: "+score);
    reset();
    draw();
    return;
  }

  snake.unshift(head);

  if(head.x===food.x&&head.y===food.y){
    score++;
    document.getElementById("score").textContent=score;
    beep(600,80);
    food=randomFood();
  } else {
    snake.pop();
  }

  draw();
}

function setDir(dir){
  if(dir==="up"&&dy===0){dx=0;dy=-1;}
  if(dir==="down"&&dy===0){dx=0;dy=1;}
  if(dir==="left"&&dx===0){dx=-1;dy=0;}
  if(dir==="right"&&dx===0){dx=1;dy=0;}
}

document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowUp")setDir("up");
  if(e.key==="ArrowDown")setDir("down");
  if(e.key==="ArrowLeft")setDir("left");
  if(e.key==="ArrowRight")setDir("right");
});

setInterval(update,120);
draw();
</script>
</body>
</html>
