<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la Culebrita</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }
        #score {
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #2ecc71;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #111;
            box-shadow: 0px 0px 25px rgba(46, 204, 113, 0.3);
            border-radius: 4px;
        }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Culebrita Clásica</h1>
    <div id="score">Puntuación: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="instructions">Usa las flechas del teclado para moverte. Presiona cualquier flecha para empezar.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Cabeza y cuerpo de la culebrita
        let snake = [{x: 10, y: 10}];
        // Comida
        let food = {x: 5, y: 5};
        // Velocidad / Dirección inicial (detenido al inicio)
        let dx = 0;
        let dy = 0;
        // Puntuación
        let score = 0;
        // Velocidad del juego (en milisegundos por frame)
        let gameSpeed = 100;
        let gameInterval;

        function main() {
            if (hasGameEnded()) {
                alert("¡Perdiste! Tu puntuación fue de: " + score);
                resetGame();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        // Configurar el bucle del juego
        gameInterval = setInterval(main, gameSpeed);

        // Mover la culebrita
        function moveSnake() {
            // Si no se está moviendo, no actualizamos la posición
            if (dx === 0 && dy === 0) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            // Verificar si comió
            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = "Puntuación: " + score;
                generateFood();
            } else {
                snake.pop(); // Si no comió, elimina la cola para mantener el tamaño
            }
        }

        // Dibujar el fondo del tablero
        function clearCanvas() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar una cuadrícula tenue de fondo
            ctx.strokeStyle = "#1a1a1a";
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        // Dibujar la culebrita
        function drawSnake() {
            snake.forEach((part, index) => {
                // La cabeza es verde brillante, el cuerpo un tono más oscuro
                ctx.fillStyle = index === 0 ? '#2ecc71' : '#27ae60';
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }

        // Dibujar la comida
        function drawFood() {
            ctx.fillStyle = '#e74c3c'; // Rojo
            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);
        }

        // Generar comida en una posición aleatoria
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Asegurar que la comida no aparezca encima de la culebrita
            snake.forEach(function(part) {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        // Detectar colisiones (paredes o su propio cuerpo)
        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        // Reiniciar el juego si pierde
        function resetGame() {
            snake = [{x: 10, y: 10}];
            food = {x: 5, y: 5};
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.innerText = "Puntuación: " + score;
        }

        // Escuchar las teclas de dirección
        window.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;

            // Evitar el desplazamiento por defecto de la página con las flechas
            if([LEFT_KEY, UP_KEY, RIGHT_KEY, DOWN_KEY].includes(event.keyCode)) {
                event.preventDefault();
            }

            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            // Evitar que la culebrita gire sobre sí misma de golpe
            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }
    </script>
</body>
</html>
